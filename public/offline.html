<title>repiq · offline</title>
<style>
  html,body{height:100%;margin:0}

  .card{background:#141416;border:1px solid rgba(255,255,255,.08);border-radius:30px;padding:2rem 1.5rem;max-width:22rem;width:100%;text-align:center}

  h1{font-size:22px;margin:1rem 0 .5rem}
  p{color:#a1a1aa;font-size:15px;line-height:1.5;margin:0 0 1.25rem}
  button{min-height:44px;width:100%;border:0;border-radius:999px;background:#baa3d0;color:#141416;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
